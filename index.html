
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Boston - Plataforma Educativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-royal-blue { background-color: #0038A8; }
        .text-royal-blue { color: #0038A8; }
        .border-royal-blue { border-color: #0038A8; }
        .bg-school-yellow { background-color: #FFD700; }
        .text-school-yellow { color: #FFD700; }
        .hover-yellow:hover { background-color: #E6C200; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        
        @keyframes draw { 
          from { stroke-dasharray: 0, 1000; } 
          to { stroke-dasharray: 1000, 1000; } 
        }
        .animate-draw { 
          stroke-dasharray: 1000;
          stroke-dashoffset: 1000;
          animation: draw-offset 2s ease-in-out forwards;
        }
        @keyframes draw-offset { to { stroke-dashoffset: 0; } }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
<script type="importmap">

  }
}

</head>

</body>
</html>
